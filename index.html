/* =========================================================================
   NORRÖNA CREW — add-on

       <script src="norrona-crew-addon.js"></script>
   or paste the whole thing inside a <script> tag in the same place.

        ahead of it, a lane that learns from every crossing. Shares its
        memory with the bridge-screen widget through the same Worker, so
        whatever one of them learns, the other one knows.
     2. SCHEDULE — a proper month strip, a framed schedule, and a viewer
        you can zoom and rotate instead of squinting at a wide image.

   ========================================================================= */

  }

  function laneOverlay(s) {
    if (!window.map || !s) return;
    if (laneLine) { map.removeLayer(laneLine); laneLine = null; }
    if (trailLine) { map.removeLayer(trailLine); trailLine = null; }

    if (s.inPort) {
      /* Alongside: the leg is finished — file it and start clean. */
      var depAtArrival = lsGet('nr_lastPort');
      if (depAtArrival && depAtArrival !== s.key) {
        var finished = depAtArrival + '|' + s.key;
        histArchive(finished, trailLoad(finished), DESTS[depAtArrival]);
        trailClear(finished);
      }
      Object.keys(DESTS).forEach(function (k) { if (k !== s.key) trailClear(s.key + '|' + k); });
      lsSet('nr_lastPort', s.key);
      if (map._line) { map.removeLayer(map._line); map._line = null; }
      return;
    }

    var dep = lsGet('nr_lastPort') || 'hirtshals';
    var stop = nextStopKey(dep, s.key);
    if (stop === dep) return;

    var reference = getRoute(dep, stop);
    if (!reference) return;
    recordFix(dep, stop, s.lat, s.lon, reference, s.kn);

    var legKey = dep + '|' + stop;
    var sailed = trailRecord(legKey, s.lat, s.lon);
    var lane = laneForLeg(dep, stop, s.lat, s.lon);
    var remaining = remainingPath(s.lat, s.lon, lane);
    var stopPort = DESTS[stop];
    if (stopPort) remaining[remaining.length - 1] = [stopPort.lat, stopPort.lon];

    /* The app's straight dashed line is replaced by the lane. */
    if (map._line) { map.removeLayer(map._line); map._line = null; }

    if (sailed && sailed.length >= 3) {
      trailLine = L.polyline(sailed, { color: '#FCB900', weight: 2, opacity: 0.42, interactive: false }).addTo(map);
    }
    laneLine = L.polyline(remaining, { color: '#FCB900', weight: 3, opacity: 0.9, interactive: false }).addTo(map);

    /* Distance and the progress bar now follow the lane, not a straight line. */
    var leftKm = pathKm(remaining), totalKm = pathKm(lane);
    var distEl = $('vDist'), railEl = $('vRail');
    if (distEl) distEl.textContent = Math.round(leftKm) + ' km';
    if (railEl && totalKm > 0) {
      var pct = Math.max(0, Math.min(100, ((totalKm - leftKm) / totalKm) * 100));
      railEl.style.width = pct + '%';
    }
  }

  /* =====================================================================
     SCHEDULE — month strip, framed schedule, and a viewer worth using
     ===================================================================== */
  var SCHED_CSS =
    '.mon-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;margin:0 -4px 4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}' +
    '.mon-strip::-webkit-scrollbar{display:none}' +
    '.mon-pill{scroll-snap-align:center;flex:0 0 auto;position:relative;border:1px solid var(--line);background:var(--glass);' +
    'color:var(--muted);border-radius:13px;padding:9px 14px;font:700 .82rem inherit;font-family:inherit;cursor:pointer;white-space:nowrap}' +
    '.mon-pill.on{background:var(--gold);border-color:var(--gold);color:#002836}' +
    '.mon-pill.now{border-color:rgba(252,185,0,.55)}' +
    '.mon-pill i{position:absolute;top:6px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--gold);display:none}' +
    '.mon-pill.has i{display:block}.mon-pill.on i{background:#002836}' +
    '.sched-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}' +
    '.sched-head h3{flex:1;margin:0}' +
    '.sched-sub{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.3px;margin-top:2px}' +
    '.sched-frame{position:relative;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.22);overflow:hidden}' +
    'body.light .sched-frame{background:rgba(255,255,255,.6)}' +
    '.sched-frame img{display:block;width:100%;cursor:zoom-in}' +
    '.sched-hint{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:5px;background:rgba(0,20,28,.72);' +
    'color:#fff;border-radius:20px;padding:5px 10px;font-size:.66rem;font-weight:700;letter-spacing:.3px;backdrop-filter:blur(6px);pointer-events:none}' +
    '.sched-hint .material-icons{font-size:14px}' +
    '.sched-skel{height:190px;background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 70%);' +
    'background-size:220% 100%;animation:schedShine 1.3s linear infinite}' +
    '@keyframes schedShine{from{background-position:120% 0}to{background-position:-120% 0}}' +
    '.sched-empty{padding:40px 20px;text-align:center;color:var(--muted)}' +
    '.sched-empty .material-icons{font-size:36px;opacity:.4;display:block;margin-bottom:10px}' +
    '.sv{position:fixed;inset:0;z-index:1200;background:rgba(0,16,23,.97);display:none;flex-direction:column}' +
    '.sv.open{display:flex}' +
    '.sv-bar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid rgba(255,255,255,.12)}' +
    '.sv-bar b{flex:1;color:#fff;font-size:.9rem;letter-spacing:.3px}' +
    '.sv-btn{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);' +
    'color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}' +
    '.sv-btn .material-icons{font-size:19px}' +
    '.sv-stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:center;justify-content:center;padding:12px}' +
    '.sv-stage img{transform-origin:center center;transition:transform .18s ease;max-width:none}' +
    '.sv-foot{padding:10px 12px calc(12px + env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.55);font-size:.7rem}';

  var svZoom = 1, svRot = 0, svSrc = '', svMonth = '';

  function injectSchedule() {
    if ($('schedStrip')) return true;
    var host = $('viewSched');
    if (!host) return false;

    var style = document.createElement('style');
    style.textContent = SCHED_CSS;
    document.head.appendChild(style);

    host.innerHTML =
      '<div class="card" style="padding:16px">' +
        '<div class="sched-head">' +
          '<div style="flex:1">' +
            '<h3 style="margin:0">Monthly schedule</h3>' +
            '<div class="sched-sub" id="schedSub">Pick a month</div>' +
          '</div>' +
          '<button class="icon-btn" id="schedOpen" aria-label="Open full screen"><span class="material-icons">open_in_full</span></button>' +
        '</div>' +
        '<div class="mon-strip" id="schedStrip"></div>' +
        '<div id="schedBox"><div class="sched-frame"><div class="sched-skel"></div></div></div>' +
      '</div>';

    var viewer = document.createElement('div');
    viewer.className = 'sv';
    viewer.id = 'schedViewer';
    viewer.innerHTML =
      '<div class="sv-bar">' +
        '<b id="svTitle">Schedule</b>' +
        '<button class="sv-btn" id="svOut" aria-label="Zoom out"><span class="material-icons">remove</span></button>' +
        '<button class="sv-btn" id="svIn" aria-label="Zoom in"><span class="material-icons">add</span></button>' +
        '<button class="sv-btn" id="svRot" aria-label="Rotate"><span class="material-icons">screen_rotation</span></button>' +
        '<button class="sv-btn" id="svClose" aria-label="Close"><span class="material-icons">close</span></button>' +
      '</div>' +
      '<div class="sv-stage" id="svStage"><img id="svImg" alt="Schedule"></div>' +
      '<div class="sv-foot">Double-tap the schedule to fit or fill</div>';
    document.body.appendChild(viewer);

    $('svClose').onclick = closeViewer;
    $('svIn').onclick = function () { setZoom(svZoom * 1.35); };
    $('svOut').onclick = function () { setZoom(svZoom / 1.35); };
    $('svRot').onclick = function () { svRot = (svRot + 90) % 360; applyView(); };
    $('schedOpen').onclick = function () { if (svSrc) openViewer(svSrc, svMonth); };
    $('svImg').addEventListener('dblclick', function () { setZoom(svZoom > 1.05 ? 1 : 2.2); });

    var lastTap = 0;
    $('svImg').addEventListener('touchend', function () {
      var now = Date.now();
      if (now - lastTap < 320) setZoom(svZoom > 1.05 ? 1 : 2.2);
      lastTap = now;
    });
    return true;
  }

  function setZoom(z) {
    svZoom = Math.max(0.6, Math.min(5, z));
    applyView();
  }
  function applyView() {
    var img = $('svImg');
    if (!img) return;
    img.style.width = (svRot % 180 === 0 ? 100 : 100) + '%';
    img.style.transform = 'rotate(' + svRot + 'deg) scale(' + svZoom + ')';
  }
  function openViewer(src, month) {
    var v = $('schedViewer');
    if (!v) return;
    $('svImg').src = src;
    $('svTitle').textContent = month || 'Schedule';
    svZoom = 1; svRot = 0; applyView();
    v.classList.add('open');
  }
  function closeViewer() {
    var v = $('schedViewer');
    if (v) v.classList.remove('open');
  }

  function monthsWithSchedule() {
    var d = (window.DATA && DATA.schedules) ? DATA.schedules[window.myDept] : null;
    var out = {};
    if (typeof d === 'string') MONTHS.forEach(function (m) { out[m] = true; });
    else if (d) Object.keys(d).forEach(function (m) { if (d[m]) out[m] = true; });
    return out;
  }

  var pickedMonth = null;

  function renderStrip() {
    var strip = $('schedStrip');
    if (!strip) return;
    var has = monthsWithSchedule();
    var now = new Date().toLocaleString('en-US', { month: 'long' });
    if (!pickedMonth) pickedMonth = has[now] ? now : (Object.keys(has)[0] || now);

    strip.innerHTML = MONTHS.map(function (m) {
      var cls = 'mon-pill' + (m === pickedMonth ? ' on' : '') + (m === now ? ' now' : '') + (has[m] ? ' has' : '');
      return '<button class="' + cls + '" data-m="' + m + '">' + m.slice(0, 3) + '<i></i></button>';
    }).join('');

    Array.prototype.forEach.call(strip.querySelectorAll('.mon-pill'), function (b) {
      b.onclick = function () { pickedMonth = b.dataset.m; renderStrip(); paintSchedule(); };
    });
    var on = strip.querySelector('.mon-pill.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function paintSchedule() {
    var box = $('schedBox');
    if (!box) return;
    var d = (window.DATA && DATA.schedules) ? DATA.schedules[window.myDept] : null;
    var src = null;
    if (typeof d === 'string') src = d;
    else if (d && d[pickedMonth]) src = d[pickedMonth];

    var sub = $('schedSub');
    if (sub) sub.textContent = src ? pickedMonth + ' ' + new Date().getFullYear() : 'Nothing posted for ' + pickedMonth;

    svSrc = src || ''; svMonth = pickedMonth;
    if (!src) {
      box.innerHTML = '<div class="sched-frame"><div class="sched-empty">' +
        '<span class="material-icons">event_busy</span>No schedule posted for ' + pickedMonth + ' yet.<br>' +
        'It appears here the moment HQ uploads it.</div></div>';
      return;
    }
    box.innerHTML = '<div class="sched-frame">' +
      '<img alt="Schedule for ' + pickedMonth + '" src="' + src + '">' +
      '<span class="sched-hint"><span class="material-icons">zoom_in</span>Tap to open</span></div>';
    box.querySelector('img').onclick = function () { openViewer(src, pickedMonth + ' schedule'); };
  }

  function installSchedulePatch() {
    if (!injectSchedule()) return false;
    window.renderSchedule = function () { renderStrip(); paintSchedule(); };
    renderStrip(); paintSchedule();
    return true;
  }

  /* --------------------------------------------------------------- start-up */
  var tries = 0;
  (function start() {
    tries++;
    var mapOk = installMapPatch();
    var schedOk = installSchedulePatch();
    if ((!mapOk || !schedOk) && tries < 40) { setTimeout(start, 250); return; }

    syncPull();
    setTimeout(function () {
      syncPush();
      setInterval(syncPush, LANE_PUSH_MS);
    }, 90000 + Math.floor(Math.random() * 60000));
    setInterval(syncPull, LANE_PULL_MS);

    window.norronaLanes = function () {
      var out = {}, keys = [];
      Object.keys(SEA_ROUTES).forEach(function (k) {
        var p = k.split('|');
        keys.push(k); keys.push(p[1] + '|' + p[0]);
      });
      keys.forEach(function (k) {
        var p = k.split('|'), store = loadLane(k), filled = 0, i;
        for (i = 0; i < LANE_BINS; i++) if (store.bins[i]) filled++;
        out[k] = {
          observations: filled,
          coverage: Math.round(filled / LANE_BINS * 100) + '%',
          crossingsOnRecord: histLoad(k).length,
          lane: buildLearnedLane(k, getRoute(p[0], p[1]))
        };
      });
      return out;
    };
  })();
})();
